<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TapLink</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 45px 22px 30px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .business-name {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .description {
            color: #999;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            padding: 15px 20px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 650;
            transition: 0.15s ease;
        }

        .link:hover {
            transform: scale(1.02);
        }

        .link:active {
            transform: scale(0.98);
        }

        .icon {
            margin-right: 10px;
            font-size: 19px;
        }

        .footer {
            margin-top: 38px;
            color: #555;
            font-size: 12px;
        }

        .error {
            color: #ff5555;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="logo" id="logo">
            TL
        </div>

        <h1 class="business-name" id="businessName">
            Cargando...
        </h1>

        <p class="description">
            Todo lo que necesitas, en un solo lugar.
        </p>

        <div class="links">

            <a class="link" id="googleLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">⭐</span>
                Déjanos una reseña en Google
            </a>

            <a class="link" id="instagramLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">📸</span>
                Síguenos en Instagram
            </a>

            <a class="link" id="whatsappLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">💬</span>
                Escríbenos por WhatsApp
            </a>

            <a class="link" id="websiteLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">🌐</span>
                Visita nuestra página web
            </a>

        </div>

        <div class="footer">
            Powered by TapLink
        </div>

        <div id="error" class="error"></div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // =========================
        // SUPABASE
        // =========================

        const SUPABASE_URL = "https://tizigescxnamlliwsbzf.supabase.co";

        const SUPABASE_KEY = "sb_publishable_HrhIu7Dx0CV6_WRZlQ2N9Q_EtVdU51T";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // =========================
        // CARGAR NEGOCIO
        // =========================

        async function loadBusiness() {

            // Obtiene el slug desde la URL
            // Ejemplo:
            // nfc-link.vercel.app/restaurante-prueba

            const pathParts = window.location.pathname
                .split("/")
                .filter(Boolean);

            const slug = pathParts[pathParts.length - 1];


            // Si no existe slug
            if (!slug) {

                document.getElementById("businessName").textContent =
                    "TapLink";

                return;
            }


            // Buscar negocio en Supabase

            const { data, error } = await supabaseClient

                .from("businesses")

                .select("*")

                .eq("slug", slug)

                .single();


            // Si existe un error

            if (error) {

                console.error("Supabase error:", error);

                document.getElementById("businessName").textContent =
                    "Negocio no encontrado";

                document.getElementById("error").textContent =
                    "No pudimos encontrar este negocio.";

                return;
            }


            // Si no existe el negocio

            if (!data) {

                document.getElementById("businessName").textContent =
                    "Negocio no encontrado";

                return;
            }


            // =========================
            // NOMBRE
            // =========================

            document.getElementById("businessName").textContent =
                data.name;


            // =========================
            // LOGO
            // =========================

            if (data.logo_url) {

                document.getElementById("logo").innerHTML = `
                    <img src="${data.logo_url}" alt="${data.name}">
                `;

            }


            // =========================
            // GOOGLE
            // =========================

            if (data.google_url) {

                document.getElementById("googleLink").href =
                    data.google_url;

            } else {

                document.getElementById("googleLink").style.display =
                    "none";

            }


            // =========================
            // INSTAGRAM
            // =========================

            if (data.instagram_url) {

                document.getElementById("instagramLink").href =
                    data.instagram_url;

            } else {

                document.getElementById("instagramLink").style.display =
                    "none";

            }


            // =========================
            // WHATSAPP
            // =========================

            if (data.whatsapp_url) {

                document.getElementById("whatsappLink").href =
                    data.whatsapp_url;

            } else {

                document.getElementById("whatsappLink").style.display =
                    "none";

            }


            // =========================
            // WEBSITE
            // =========================

            if (data.website_url) {

                document.getElementById("websiteLink").href =
                    data.website_url;

            } else {

                document.getElementById("websiteLink").style.display =
                    "none";

            }

        }


        // Ejecutar

        loadBusiness();

    </script>

</body>
</html>
