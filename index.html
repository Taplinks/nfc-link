<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapLink</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            background: #111;
            border-radius: 50%;
            margin: 10px auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #111;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">TL</div>

        <h1>Mi Negocio</h1>

        <p class="description">
            Encuéntranos en nuestras redes
        </p>

        <a class="button" href="#">
            ⭐ Déjanos una reseña en Google
        </a>

        <a class="button" href="#">
            📸 Instagram
        </a>

        <a class="button" href="#">
            💬 WhatsApp
        </a>

        <a class="button" href="#">
            🌐 Nuestra página web
        </a>

        <div class="footer">
            Powered by TapLink
        </div>

    </div>

</body>
</html>
