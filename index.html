<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TapLink</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 45px 22px 30px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .business-name {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .description {
            color: #999;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            padding: 15px 20px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 650;
            transition: 0.15s ease;
        }

        .link:hover {
            transform: scale(1.02);
        }

        .link:active {
            transform: scale(0.98);
        }

        .icon {
            margin-right: 10px;
            font-size: 19px;
        }

        .map-title {
            margin-top: 32px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 700;
        }

        .map-container {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            background: #111;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .footer {
            margin-top: 38px;
            color: #555;
            font-size: 12px;
        }

        .error {
            color: #ff5555;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="logo" id="logo">
            TL
        </div>

        <h1 class="business-name" id="businessName">
            Cargando...
        </h1>

        <p class="description">
            Todo lo que necesitas, en un solo lugar.
        </p>

        <div class="links">

            <a class="link" id="googleLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">⭐</span>
                Déjanos una reseña en Google
            </a>

            <a class="link" id="instagramLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">📸</span>
                Síguenos en Instagram
            </a>

            <a class="link" id="whatsappLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">💬</span>
                Escríbenos por WhatsApp
            </a>

            <a class="link" id="websiteLink" target="_blank" rel="noopener noreferrer">
                <span class="icon">🌐</span>
                Visita nuestra página web
            </a>

        </div>


        <!-- =========================
             GOOGLE MAPS
        ========================= -->

        <div id="mapSection" style="display: none;">

            <div class="map-title">
                📍 Nuestra ubicación
            </div>

            <div class="map-container">

                <iframe
                    id="googleMap"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

        </div>


        <div class="footer">
            Powered by TapLink
        </div>

        <div id="error" class="error"></div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // =========================
        // SUPABASE
        // =========================

        const SUPABASE_URL =
            "https://tizigescxnamlliwsbzf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_HrhIu7Dx0CV6_WRZlQ2N9Q_EtVdU51T";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =========================
        // REGISTRAR CLIC
        // =========================

        async function trackClick(button, businessId) {

            const { error } =
                await supabaseClient.rpc(
                    "increment_analytics",
                    {
                        p_business_id: businessId,
                        p_button: button
                    }
                );

            if (error) {

                console.error(
                    "Error registrando clic:",
                    error
                );

            }

        }


        // =========================
        // CARGAR NEGOCIO
        // =========================

        async function loadBusiness() {

            const pathParts =
                window.location.pathname
                    .split("/")
                    .filter(Boolean);

            const slug =
                pathParts[pathParts.length - 1];


            // Si no existe slug

            if (!slug) {

                document.getElementById(
                    "businessName"
                ).textContent = "TapLink";

                return;

            }


            // =========================
            // BUSCAR NEGOCIO
            // =========================

            const { data, error } =
                await supabaseClient
                    .from("businesses")
                    .select("*")
                    .eq("slug", slug)
                    .single();


            // Error

            if (error) {

                console.error(
                    "Supabase error:",
                    error
                );

                document.getElementById(
                    "businessName"
                ).textContent =
                    "Negocio no encontrado";

                document.getElementById(
                    "error"
                ).textContent =
                    "No pudimos encontrar este negocio.";

                return;

            }


            // Negocio no encontrado

            if (!data) {

                document.getElementById(
                    "businessName"
                ).textContent =
                    "Negocio no encontrado";

                return;

            }


            // =========================
            // NOMBRE
            // =========================

            document.getElementById(
                "businessName"
            ).textContent =
                data.name;


            // =========================
            // LOGO
            // =========================

            if (data.logo_url) {

                document.getElementById(
                    "logo"
                ).innerHTML = `
                    <img
                        src="${data.logo_url}"
                        alt="${data.name}"
                    >
                `;

            }


            // =========================
            // GOOGLE
            // =========================

            if (data.google_url) {

                const link =
                    document.getElementById(
                        "googleLink"
                    );

                link.href =
                    data.google_url;

                link.addEventListener(
                    "click",
                    () => {

                        trackClick(
                            "google",
                            data.id
                        );

                    }
                );

            } else {

                document.getElementById(
                    "googleLink"
                ).style.display =
                    "none";

            }


            // =========================
            // INSTAGRAM
            // =========================

            if (data.instagram_url) {

                const link =
                    document.getElementById(
                        "instagramLink"
                    );

                link.href =
                    data.instagram_url;

                link.addEventListener(
                    "click",
                    () => {

                        trackClick(
                            "instagram",
                            data.id
                        );

                    }
                );

            } else {

                document.getElementById(
                    "instagramLink"
                ).style.display =
                    "none";

            }


            // =========================
            // WHATSAPP
            // =========================

            if (data.whatsapp_url) {

                const link =
                    document.getElementById(
                        "whatsappLink"
                    );

                link.href =
                    data.whatsapp_url;

                link.addEventListener(
                    "click",
                    () => {

                        trackClick(
                            "whatsapp",
                            data.id
                        );

                    }
                );

            } else {

                document.getElementById(
                    "whatsappLink"
                ).style.display =
                    "none";

            }


            // =========================
            // WEBSITE
            // =========================

            if (data.website_url) {

                const link =
                    document.getElementById(
                        "websiteLink"
                    );

                link.href =
                    data.website_url;

                link.addEventListener(
                    "click",
                    () => {

                        trackClick(
                            "website",
                            data.id
                        );

                    }
                );

            } else {

                document.getElementById(
                    "websiteLink"
                ).style.display =
                    "none";

            }


            // =========================
            // GOOGLE MAPS
            // =========================

            if (data.maps_url) {

                const mapSection =
                    document.getElementById(
                        "mapSection"
                    );

                const googleMap =
                    document.getElementById(
                        "googleMap"
                    );

                googleMap.src =
                    data.maps_url;

                mapSection.style.display =
                    "block";

            }

        }


        // =========================
        // EJECUTAR
        // =========================

        loadBusiness();

    </script>

</body>
</html>
