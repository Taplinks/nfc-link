<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TapLink</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 45px 22px 30px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .business-name {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .description {
            color: #999;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            padding: 15px 20px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 650;
            transition: 0.15s ease;
        }

        .link:hover {
            transform: scale(1.02);
        }

        .link:active {
            transform: scale(0.98);
        }

        .icon {
            margin-right: 10px;
            font-size: 19px;
        }

        .map-title {
            margin-top: 32px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 700;
        }

        .map-container {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            background: #111;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .footer {
            margin-top: 38px;
            color: #555;
            font-size: 12px;
        }

        .error {
            color: #ff5555;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="logo" id="logo">
            TL
        </div>

        <h1 class="business-name" id="businessName">
            Cargando...
        </h1>

        <p class="description">
            Todo lo que necesitas, en un solo lugar.
        </p>

        <div class="links">

            <a
                class="link"
                id="googleLink"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">⭐</span>
                Déjanos una reseña en Google
            </a>

            <a
                class="link"
                id="instagramLink"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">📸</span>
                Síguenos en Instagram
            </a>

            <a
                class="link"
                id="whatsappLink"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">💬</span>
                Escríbenos por WhatsApp
            </a>

            <a
                class="link"
                id="websiteLink"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">🌐</span>
                Visita nuestra página web
            </a>

        </div>

        <div id="mapSection" style="display: none;">

            <div class="map-title">
                📍 Nuestra ubicación
            </div>

            <div class="map-container">

                <iframe
                    id="googleMap"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

        </div>

        <div class="footer">
            Powered by TapLink
        </div>

        <div id="error" class="error"></div>

    </main>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://tizigescxnamlliwsbzf.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_HrhIu7Dx0CV6_WRZlQ2N9Q_EtVdU51T";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =========================
        // DISPOSITIVO
        // =========================

        function getDevice() {

            if (
                /Mobi|Android|iPhone|iPad/i.test(
                    navigator.userAgent
                )
            ) {
                return "mobile";
            }

            return "desktop";
        }


        // =========================
        // NAVEGADOR
        // =========================

        function getBrowser() {

            const ua =
                navigator.userAgent;

            if (ua.includes("Edg")) {
                return "Edge";
            }

            if (ua.includes("Chrome")) {
                return "Chrome";
            }

            if (ua.includes("Firefox")) {
                return "Firefox";
            }

            if (ua.includes("Safari")) {
                return "Safari";
            }

            return "Other";
        }


        // =========================
        // TRACKING NFC
        // =========================

        async function trackNfcClick(
            code,
            destination = "landing"
        ) {

            try {

                const { data, error } =
                    await supabaseClient.rpc(
                        "track_nfc_click",
                        {
                            p_code: code,
                            p_destination: destination,
                            p_device: getDevice(),
                            p_browser: getBrowser()
                        }
                    );

                if (error) {

                    console.error(
                        "Error registrando NFC:",
                        error
                    );

                    return null;
                }

                console.log(
                    "NFC registrado:",
                    data
                );

                return data;

            } catch (error) {

                console.error(
                    "Error inesperado:",
                    error
                );

                return null;
            }
        }


        // =========================
        // TRACKING BOTONES
        // =========================

        async function trackButtonClick(
            button,
            businessId,
            nfcId = null
        ) {

            try {

                const { error } =
                    await supabaseClient
                        .from("clicks")
                        .insert({

                            button: button,

                            business_id:
                                businessId,

                            nfc_id:
                                nfcId,

                            source:
                                nfcId
                                    ? "nfc"
                                    : "direct",

                            destination:
                                button,

                            device:
                                getDevice(),

                            browser:
                                getBrowser()

                        });

                if (error) {

                    console.error(
                        "Error registrando botón:",
                        error
                    );

                }

            } catch (error) {

                console.error(
                    "Error inesperado:",
                    error
                );

            }
        }


        // =========================
        // CONFIGURAR BOTÓN
        // =========================

        function setupButton(
            elementId,
            url,
            buttonName,
            businessId,
            nfcId
        ) {

            const link =
                document.getElementById(
                    elementId
                );

            if (!link) {
                return;
            }

            if (!url) {

                link.style.display =
                    "none";

                return;
            }

            link.href = url;

            link.addEventListener(
                "click",
                function () {

                    trackButtonClick(
                        buttonName,
                        businessId,
                        nfcId
                    );

                }
            );
        }


        // =========================
        // CARGAR NEGOCIO
        // =========================

        async function loadBusiness() {

            const pathParts =
                window.location.pathname
                    .split("/")
                    .filter(Boolean);


            let business = null;
            let nfc = null;


            // =================================================
            // MODO NFC
            // /r/TANTA-001
            // =================================================

            if (
                pathParts.length >= 2 &&
                pathParts[0].toLowerCase() === "r"
            ) {

                const nfcCode =
                    decodeURIComponent(
                        pathParts[1]
                    );


                console.log(
                    "Buscando NFC:",
                    nfcCode
                );


                // =========================
                // OBTENER NFC + NEGOCIO
                // =========================

                const { data, error } =
                    await supabaseClient.rpc(
                        "get_nfc_business",
                        {
                            p_code: nfcCode
                        }
                    );


                console.log(
                    "Respuesta NFC:",
                    data
                );


                if (error) {

                    console.error(
                        "Error RPC:",
                        error
                    );

                    document.getElementById(
                        "businessName"
                    ).textContent =
                        "Error de conexión";

                    document.getElementById(
                        "error"
                    ).textContent =
                        "No pudimos conectar con TapLink.";

                    return;
                }


                if (
                    !data ||
                    data.success !== true
                ) {

                    document.getElementById(
                        "businessName"
                    ).textContent =
                        "NFC no encontrado";

                    document.getElementById(
                        "error"
                    ).textContent =
                        data?.error ||
                        "Este enlace NFC no existe o está inactivo.";

                    return;
                }


                // =========================
                // GUARDAR DATOS
                // =========================

                nfc =
                    data.nfc;

                business =
                    data.business;


                // =========================
                // REGISTRAR TOQUE
                // =========================

                await trackNfcClick(
                    nfc.code,
                    "landing"
                );

            }


            // =================================================
            // MODO NORMAL
            // /tanta
            // =================================================

            else {

                const slug =
                    pathParts[
                        pathParts.length - 1
                    ];


                if (!slug) {

                    document.getElementById(
                        "businessName"
                    ).textContent =
                        "TapLink";

                    return;
                }


                const { data, error } =
                    await supabaseClient
                        .from("businesses")
                        .select("*")
                        .eq("slug", slug)
                        .single();


                if (error || !data) {

                    console.error(
                        "Error negocio:",
                        error
                    );

                    document.getElementById(
                        "businessName"
                    ).textContent =
                        "Negocio no encontrado";

                    document.getElementById(
                        "error"
                    ).textContent =
                        "No pudimos encontrar este negocio.";

                    return;
                }


                business =
                    data;
            }


            // =================================================
            // NOMBRE
            // =================================================

            document.getElementById(
                "businessName"
            ).textContent =
                business.name;


            // =================================================
            // LOGO
            // =================================================

            if (business.logo_url) {

                document.getElementById(
                    "logo"
                ).innerHTML = `

                    <img
                        src="${business.logo_url}"
                        alt="${business.name}"
                    >

                `;
            }


            // =================================================
            // GOOGLE
            // =================================================

            setupButton(
                "googleLink",
                business.google_url,
                "google",
                business.id,
                nfc ? nfc.id : null
            );


            // =================================================
            // INSTAGRAM
            // =================================================

            setupButton(
                "instagramLink",
                business.instagram_url,
                "instagram",
                business.id,
                nfc ? nfc.id : null
            );


            // =================================================
            // WHATSAPP
            // =================================================

            setupButton(
                "whatsappLink",
                business.whatsapp_url,
                "whatsapp",
                business.id,
                nfc ? nfc.id : null
            );


            // =================================================
            // WEBSITE
            // =================================================

            setupButton(
                "websiteLink",
                business.website_url,
                "website",
                business.id,
                nfc ? nfc.id : null
            );


            // =================================================
            // GOOGLE MAPS
            // =================================================

            if (business.maps_url) {

                const mapSection =
                    document.getElementById(
                        "mapSection"
                    );

                const googleMap =
                    document.getElementById(
                        "googleMap"
                    );

                googleMap.src =
                    business.maps_url;

                mapSection.style.display =
                    "block";
            }

        }


        // =========================
        // INICIAR
        // =========================

        loadBusiness();

    </script>

</body>
</html>
